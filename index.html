<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>متتبع الصلاة</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#1f7a52"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="الصلاة"><meta name="format-detection" content="telephone=no">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f1f4ef;--card:#fff;--tx:#17231d;--mu:#6b776f;--ac:#1f7a52;--ac2:#2fa070;--bd:#e0e6df;--bad:#b3392f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1713;--card:#19251f;--tx:#e8efe9;--mu:#97a69c;--ac:#4fbf8a;--ac2:#2f9f70;--bd:#2a3a32;--bad:#e5776d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1713;--card:#19251f;--tx:#e8efe9;--mu:#97a69c;--ac:#4fbf8a;--ac2:#2f9f70;--bd:#2a3a32;--bad:#e5776d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;max-width:520px;margin:auto;padding:12px 14px 110px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}
input,select{font:inherit;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;box-sizing:border-box}
input[type=checkbox],input[type=radio]{width:auto}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.g{flex:1}
.mu{color:var(--mu);font-size:13px}.pos{color:var(--ac)}.neg{color:var(--bad)}
.warn{background:#fff3cd;color:#5c4400;border:1px solid #e6c65c;border-radius:12px;padding:10px;margin:10px 0;font-size:14px}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 10px}
.avb{padding:0;background:none;width:54px;height:54px;border-radius:50%;border:2px solid var(--ac);overflow:hidden;flex:none}
.avb svg{width:100%;height:100%;display:block}
.nm{font-weight:bold;font-size:17px}
.chip{background:var(--ac);color:#fff;border-radius:14px;padding:6px 12px;text-align:center;line-height:1.2}.chip b{font-size:20px;display:block}.chip span{font-size:11px;opacity:.9}.chip.neg{background:var(--bad)}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{flex:1;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px}
.nav button.on{color:var(--ac);font-weight:bold}
.hero{text-align:center;padding:30px 10px 14px}
.logo{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,var(--ac),var(--ac2));margin:0 auto 14px;display:flex;align-items:center;justify-content:center}.logo svg{width:60px;height:60px}
.hero h1{margin:6px 0;font-size:26px}.hero p{color:var(--mu);margin:0}
.gbtn{width:100%;background:#fff;color:#222;border:1px solid #dadce0;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:bold;padding:13px}
.gbtn svg{width:20px;height:20px}
.feat{display:flex;gap:8px;margin-top:12px}.feat div{flex:1;text-align:center;font-size:12px;color:var(--mu);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px}
.pri{width:100%;padding:14px;font-weight:bold;font-size:16px;margin-top:6px}
.lb{display:block;font-weight:bold;margin-bottom:8px}
.gcards{display:flex;gap:10px}.gc{flex:1;border:2px solid var(--bd);border-radius:16px;padding:10px;text-align:center;cursor:pointer;position:relative}.gc input{position:absolute;opacity:0}.gc svg{width:72px;height:72px;display:block;margin:0 auto 4px}.gc:has(input:checked){border-color:var(--ac);background:rgba(47,160,112,.12)}
.timer{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;text-align:center}.timer .mu{color:#ffffffd0}
.big{font-size:28px;font-weight:bold}
.pc{border-right:4px solid var(--bd)}.pc.ok{border-right-color:var(--ac)}.pc.bad{border-right-color:var(--bad)}
.avg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.avg button{padding:6px;background:var(--bg);border:2px solid var(--bd);border-radius:16px}.avg button.on{border-color:var(--ac)}.avg svg{width:100%;display:block}
.bigav{width:104px;height:104px;margin:0 auto 12px}.bigav svg{width:100%;height:100%}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.row svg{width:44px;height:44px;flex:none}.me{font-weight:bold}
.r1{color:#d4a017}.r2{color:#8e9aa6}.r3{color:#b0713a}
#md{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#md>div{background:var(--card);border-radius:16px;padding:16px;max-width:360px}

button{transition:transform .15s ease,filter .15s,background .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.93);filter:brightness(1.12)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,191,138,.45)}50%{box-shadow:0 0 0 10px rgba(79,191,138,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.anim .pg>*{animation:up .4s ease both}
.anim .pg>:nth-child(2){animation-delay:.05s}.anim .pg>:nth-child(3){animation-delay:.1s}.anim .pg>:nth-child(4){animation-delay:.15s}.anim .pg>:nth-child(5){animation-delay:.2s}.anim .pg>:nth-child(6){animation-delay:.25s}.anim .pg>:nth-child(7){animation-delay:.3s}
.nav button.on svg{animation:pop .4s ease}
.timer{animation:pulse 2.6s ease-in-out infinite}
.avb{animation:pop .5s ease}.chip{animation:pop .5s ease}
.gc{transition:transform .15s,border-color .2s,background .2s}.gc:active{transform:scale(.96)}
.avg button.on{transform:scale(1.04)}
#md{animation:fade .2s}#md>div{width:100%;max-width:360px;animation:up .25s ease}
.avwrap{position:relative;width:104px;margin:0 auto 12px}.avwrap .bigav{margin:0}
.pen{position:absolute;bottom:-2px;left:-2px;width:36px;height:36px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid var(--card)}
.pre{opacity:.6}
.out{width:100%;margin-top:12px;color:var(--bad);border-color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tap{cursor:pointer}
.chip{border:0;display:block;font:inherit}
.chev{width:24px;height:24px;margin:2px auto 0;display:block;transition:transform .4s ease;stroke:#fff}.chev.up{transform:rotate(180deg)}
.badge{display:inline-block;background:#fff;color:var(--ac);border-radius:20px;padding:2px 12px;font-size:12px;font-weight:bold;margin-top:6px;animation:pop .5s ease}
.drawer{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s ease,opacity .35s ease}
.drawer.open{grid-template-rows:1fr;opacity:1}
.drawer>div{overflow:hidden;min-height:0}

.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.task:last-child{border:0}.tk{flex:1}
.sm{padding:7px 12px;font-size:13px}
.bar{height:10px;background:var(--bd);border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:8px;transition:width .6s ease}
.tbl .th,.tbl .tr{display:grid;grid-template-columns:1.4fr 1.2fr .8fr 44px;gap:6px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--bd);font-size:13px}.tbl .th{color:var(--mu);font-weight:bold}.tr.today{background:rgba(47,160,112,.14);border-radius:10px}.tr.missed{color:var(--bad)}
.ck{width:34px;height:34px;padding:0;border-radius:50%;background:transparent;border:2px solid var(--bd);color:transparent;font-size:16px}.ck.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sw{width:50px;height:28px;padding:0;border-radius:20px;background:var(--bd);position:relative}.sw i{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s}.sw.on{background:var(--ac)}.sw.on i{transform:translateX(-22px)}
.dz .dt{font-size:20px;line-height:2.1;text-align:center;font-family:"Amiri","Scheherazade New","Traditional Arabic",serif}.cnt{background:var(--ac);color:#fff;border-radius:20px;padding:2px 12px;font-size:12px}.task.dn .tk b{color:var(--ac)}
.spin{width:44px;height:44px;border:4px solid var(--bd);border-top-color:var(--ac);border-radius:50%;margin:32vh auto 14px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.cbtn{width:100%;margin-top:10px;padding:14px;border-radius:16px;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;-webkit-user-select:none;touch-action:manipulation}.cbtn b{font-size:28px}.cbtn span{font-size:12px;opacity:.85}.cbtn.full{background:var(--bd);color:var(--ac);font-weight:bold}
.rst{background:none;color:var(--mu);font-size:12px;padding:4px 8px}.pri.dis{background:var(--bd);color:var(--mu)}
.apc{position:sticky;top:0;z-index:6;margin-top:0}
.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px;margin:14px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}

.err{background:#fdecea;color:#b3261e;border:1px solid #f1b0ab;border-radius:12px;padding:10px;margin:10px 0;font-size:14px}
.okm{background:#e6f4ec;color:#14532d;border:1px solid #9bd3b3;border-radius:12px;padding:10px;margin:10px 0;font-size:14px}
@media (prefers-color-scheme:dark){.err{background:#3a1d1b;color:#ffb4ab;border-color:#6b2c28}.okm{background:#173626;color:#9fe0bd;border-color:#2c5a43}}
button.out{background:var(--bad);color:#fff;border:0}
.fld{position:relative;margin-top:10px}.fld .fi{position:absolute;top:50%;transform:translateY(-50%);right:14px;width:20px;height:20px;color:var(--mu);pointer-events:none}
.fld input{padding-right:44px;padding-left:44px;text-align:right}
.eye{position:absolute;left:4px;top:50%;transform:translateY(-50%);background:none;color:var(--mu);padding:8px}.eye svg{width:20px;height:20px;display:block}
.link{background:none;color:var(--ac);padding:4px 6px;font-size:14px;font-weight:bold}
.feat div svg{width:24px;height:24px;display:block;margin:0 auto 6px;color:var(--ac)}
.backb{width:40px;height:40px;padding:0;border-radius:50%;background:var(--card);color:var(--tx);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center}.backb svg{width:20px;height:20px}
.title2{font-size:22px;font-weight:bold;margin:12px 0 4px}
.logo.sm{width:72px;height:72px;border-radius:22px;margin-bottom:8px}.logo.sm svg{width:44px;height:44px}

[data-st]{animation:drop .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes drop{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
@keyframes zoom{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.55);opacity:0}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-10px);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.splash{--s:min(39vw,240px);position:fixed;inset:0;background:radial-gradient(circle at 50% 46%,#1f7a52,#16634a 72%);color:#fff;z-index:100;text-align:center}
.sp-wrap{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2)}
.sp-wrap:before,.sp-wrap:after{content:"";position:absolute;inset:0;border-radius:24%;border:2px solid #ffffff77;animation:ring 2.2s ease-out infinite}.sp-wrap:after{animation-delay:1.1s}

function calc(lat,lng,date){

<script type="module">
